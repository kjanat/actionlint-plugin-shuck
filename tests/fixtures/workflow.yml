name: Shuck integration fixture
on: push
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Run Bash with Unicode
        shell: bash
        run: |
          echo 😀; echo $HOME
      - name: Run Bash with a quoted variable
        shell: bash
        run: echo "$HOME"
      - name: POSIX
        shell: sh
        run: echo $HOME
      - name: Zsh
        shell: zsh -f {0}
        run: echo $HOME
      - name: Mksh
        shell: mksh {0}
        run: echo $HOME
      - name: Python
        shell: python
        run: print('hello')
      - name: PowerShell
        shell: pwsh
        run: Write-Output $env:HOME
      - name: Suppress a rule inside the script
        shell: bash
        run: |
          # shuck: disable=S001
          echo $HOME
      - name: Suppress a rule in a YAML comment
        shell: bash
        # shuck: disable=S001
        run: echo $HOME
      - name: Suppress the plugin through actionlint
        shell: bash
        # actionlint-ignore-next-line shuck
        run: echo $HOME
      - name: Declare an environment variable
        shell: bash
        env:
          declared_name: present
        run: echo "$declared_name"
      - name: Call the composite action
        uses: ./.github/actions/example
