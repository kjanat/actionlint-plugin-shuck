["build"]
description = "Compile the Shuck plugin to WebAssembly"
sources = ["src/**/*.rs", "Cargo.*"]
outputs = ["target/wasm32-wasip2/release/actionlint_plugin_shuck.wasm"]
run = "cargo build --locked -j 1 --release --lib --target wasm32-wasip2"

["package"]
description = "Create the plugin package, metadata, schema and checksums"
depends = ["build"]
sources = ["src/**/*.rs", "Cargo.*", "LICENSE", "target/wasm32-wasip2/release/actionlint_plugin_shuck.wasm"]
outputs = ["artifacts/*"]
run = "cargo run --locked -j 1 --features package --bin package -- target/wasm32-wasip2/release/actionlint_plugin_shuck.wasm artifacts"

["test"]
description = "Run the Rust tests for analysis, source mapping and fixes"
run = "cargo test --locked -j 1 --all-targets --features package"

["test:host"]
description = "Run integration tests with the ACTIONLINT executable"
depends = ["package"]
run = "bun run test"

["typecheck"]
run = "bun run typecheck"

["lint"]
run = "cargo clippy --locked -j 1 --all-targets --features package -- -D warnings"

["format"]
alias = "fmt"
run = "kprint fmt"
