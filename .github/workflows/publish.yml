name: Submit the Shuck plugin to the registry
on:
  push: { tags: ["v*"] }
  workflow_dispatch: null
permissions: { contents: read }
defaults: { run: { shell: "bash -euo pipefail {0}" } }
jobs:
  submit:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read, id-token: write }
    steps:
      - name: Wait until the release is published and immutable
        env: { GH_TOKEN: "${{ github.token }}", tag: "${{ github.ref_name }}" }
        id: publication
        run: |
          for attempt in {1..60}; do
            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" >release.json \
              && jq -e '.immutable == true and .draft == false' release.json; then break;
            fi
            sleep 10
          done
          jq -e '.immutable == true and .draft == false' release.json
          digest="$(jq -er '.assets[] | select(.name == "plugin.wasm") | .digest' release.json)"
          printf 'PLUGIN_SHA256=%s\n' "${digest#sha256:}" >> "${GITHUB_OUTPUT}"
      - uses: kjanat/actionlint-registry@master
        with:
          asset: plugin.wasm
          sha256: "${{ steps.publication.outputs.PLUGIN_SHA256 }}"
          kind: component
